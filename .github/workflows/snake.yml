name: Gerar cobrinha de contribuições

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Paleta Claude: quadrados em tons de terracota, cobrinha D97757
          outputs: |
            dist/github-snake.svg?color_snake=#C15F3C&color_dots=#EBE8DF,#F2C9B6,#E8A385,#D97757,#C15F3C
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#D97757&color_dots=#30302E,#5C3A2C,#8A4A33,#C15F3C,#D97757

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
